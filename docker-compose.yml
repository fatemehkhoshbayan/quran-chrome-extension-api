services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dailyquran
      POSTGRES_PASSWORD: dailyquran
      POSTGRES_DB: dailyquran
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dailyquran -d dailyquran']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://dailyquran:dailyquran@db:5432/dailyquran?schema=public
      QF_USER_REDIRECT_URI: http://localhost:3000/auth/quran/callback
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
